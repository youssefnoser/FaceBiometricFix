name: Build & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Read version and detect version change
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts)
          version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)
          if [[ -z "$version_code" || -z "$version_name" ]]; then
            echo "Unable to read versionCode/versionName" >&2
            exit 1
          fi

          version_changed=true
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            old_version_code=$(git show "${{ github.event.before }}:app/build.gradle.kts" 2>/dev/null | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' || true)
            old_version_name=$(git show "${{ github.event.before }}:app/build.gradle.kts" 2>/dev/null | sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' || true)
            [[ "$version_code-$version_name" != "$old_version_code-$old_version_name" ]] || version_changed=false
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version_name}" >> "$GITHUB_OUTPUT"
          echo "apk_tag=${version_code}-${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"
          echo "Release tag: v${version_name}; version changed: $version_changed"

      - name: Stop when software version did not change
        if: steps.version.outputs.version_changed != 'true'
        run: echo "No version change; release skipped."

      # No signing.properties here, so the release build is signed with the
      # AOSP test key committed as debug.keystore (see app/build.gradle.kts).
      - name: Build release APK
        if: steps.version.outputs.version_changed == 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK
        if: steps.version.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          apk_name="FaceBiometricFix-${{ steps.version.outputs.apk_tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk_name"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: Create release
        if: steps.version.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.version.outputs.release_tag }}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists in $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          gh release create "$release_tag" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_tag" \
            --generate-notes \
            --notes "Signed with the public AOSP test key, not the original author's key. Uninstall the original module before installing."
